[package]
name = "xlsx-to-pdf"
version = "0.1.0"
edition = "2021"
authors = ["Nicolás Hatcher <nicolas@theuniverse.today>", "IronCalc Contributors"]
description = "Convert Excel (.xlsx) workbooks to PDF. WebAssembly bindings for IronCalc's PDF export engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ironcalc/IronCalc"
homepage = "https://www.ironcalc.com"
readme = "README.md"
keywords = ["xlsx", "excel", "pdf", "spreadsheet", "wasm"]
categories = ["wasm", "text-processing"]

[features]
# The PDF engine's serde derives are gated on this feature (see `src/pdf`).
# The wasm API always needs them, so disabling default features is not supported.
default = ["serde"]
serde = []

[lib]
name = "xlsx_to_pdf"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Uses `../../../xlsx` when used locally, and the indicated version from
# crates.io when published.
# https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#multiple-locations
ironcalc = { path = "../../../xlsx", version = "0.9", default-features = false }
ironcalc_base = { path = "../../../base", version = "0.9" }
# Dependencies of the vendored PDF engine (see `src/pdf`).
chrono = "0.4"
hipdf = "1.3.8"
thiserror = "1.0"
wasm-bindgen = "0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3.38"
