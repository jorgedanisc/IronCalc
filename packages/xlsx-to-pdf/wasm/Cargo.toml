[package]
name = "xlsx-to-pdf-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Nicolás Hatcher <nicolas@theuniverse.today>", "IronCalc Contributors"]
description = "WebAssembly bindings for xlsx-to-pdf"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ironcalc_base = { path = "../../../base", version = "0.9" }
ironcalc = { path = "../../../xlsx", version = "0.9", default-features = false, features = ["pdf"] }
ironcalc_pdf = { path = "../../../pdf", version = "0.1", features = ["serde"] }
wasm-bindgen = "0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.38"
